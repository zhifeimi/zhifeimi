<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="t d">
<title id="t">Career timeline as a git graph</title>
<desc id="d">2013 — 2017: init: B.Eng Electronic Info Eng. (Inner Mongolia Univ. of Technology); Feb 2017: Intern → Full-time in 5 months (China DataCom); 2017 — 2021: Software Engineer (Java/Spring · telecom &amp; gov); 2021 — 2022: Software Group Leader (China DataCom); 2021 — 2023: M.Eng · High Distinction (Arizona State University); 2023 — 2025: M.CS · Distinction (University of Wollongong); 2025 —: DentistDSS goes live (Solo architect &amp; developer); 2026: PMP® certified (PMI)</desc>
<defs>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="0.8999999999999999" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowS" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="0.42" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowL" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="2" fill="#000" opacity="0.05"/>
  </pattern>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#ddd3f2" opacity="0.35"/>
  </pattern>
  <linearGradient id="neon" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#d1004f"/><stop offset="0.5" stop-color="#7c3aed"/><stop offset="1" stop-color="#00808f"/>
  </linearGradient>
  <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
    <stop offset="0.6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
</defs>
<style>
  text { font-family: 'JetBrains Mono','Fira Code','Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
  .cjk { font-family: 'JetBrains Mono','Fira Code','Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace, 'Noto Sans Mono CJK SC','Noto Sans CJK SC','PingFang SC','Hiragino Sans','Microsoft YaHei',sans-serif; }
  .flicker { animation: flicker 6s linear infinite; }
  @keyframes flicker {
    0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
    20%, 24%, 55% { opacity: 0.35; }
  }
  .blink { animation: blink 1.1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
  /* Entrance animations use backwards fill: if they never run, everything is still visible. */
  .draw { animation: draw 2.4s ease-out backwards; }
  @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  .node { animation: pop 0.5s ease-out backwards; }
  @keyframes pop { from { opacity: 0; } to { opacity: 1; } }
  .ping { animation: ping 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes ping { from { transform: scale(0.6); opacity: 1; } to { transform: scale(2.4); opacity: 0; } }

</style>


