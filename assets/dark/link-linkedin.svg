<svg xmlns="http://www.w3.org/2000/svg" width="280" height="64" viewBox="0 0 280 64" role="img" aria-labelledby="t d">
<title id="t">LINKEDIN</title>
<desc id="d">LINKEDIN</desc>
<defs>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowS" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="1.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowL" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="2" fill="#000" opacity="0.28"/>
  </pattern>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#4b3b78" opacity="0.35"/>
  </pattern>
  <linearGradient id="neon" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#ff2a6d"/><stop offset="0.5" stop-color="#a855f7"/><stop offset="1" stop-color="#05d9e8"/>
  </linearGradient>
  <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
    <stop offset="0.6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.55"/>
  </radialGradient>
</defs>
<style>
  text { font-family: 'JetBrains Mono','Fira Code','Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
  .cjk { font-family: 'JetBrains Mono','Fira Code','Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace, 'Noto Sans Mono CJK SC','Noto Sans CJK SC','PingFang SC','Hiragino Sans','Microsoft YaHei',sans-serif; }
  .flicker { animation: flicker 6s linear infinite; }
  @keyframes flicker {
    0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
    20%, 24%, 55% { opacity: 0.35; }
  }
  .blink { animation: blink 1.1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }.pulse { animation: beacon 2s ease-in-out infinite; } @keyframes beacon { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
</style>

<path d="M14,2 H278 V50 L266,62 H2 V14 Z" fill="#120a26" stroke="#ff2a6d" stroke-width="1.5"/>
<g transform="translate(18,18)">
  <rect width="28" height="28" fill="none" stroke="#ff2a6d" stroke-width="1.5"/>
  <rect x="7" y="7" width="14" height="14" fill="#ff2a6d" class="pulse"/>
</g>
<text x="60" y="30" font-size="15" font-weight="800" fill="#e6f7ff" letter-spacing="1.5">LINKEDIN</text>
