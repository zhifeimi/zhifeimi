<desc id="d">BACKEND: Java, Spring Boot, Spring Cloud, Python / Flask, REST, OAuth2 / JWT, MyBatis, Hibernate. FRONTEND: TypeScript, React, Vue 3, Tailwind, PWA, Electron, Three.js. DATA &amp; ML: PostgreSQL, MongoDB, MySQL, Redis, PyTorch, TensorFlow, Spark, DSP. CLOUD &amp; OPS: AWS, Oracle Cloud, Docker, Kubernetes, Jenkins, Nginx, WireGuard, Linux. LEADERSHIP: PMP®, Agile / Scrum, Risk Mgmt, Architecture Reviews, Mentoring, Roadmaps</desc>
