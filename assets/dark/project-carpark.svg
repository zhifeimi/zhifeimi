<svg xmlns="http://www.w3.org/2000/svg" width="590" height="210" viewBox="0 0 590 210" role="img" aria-labelledby="t d">
<title id="t">CarPark — PARKING RESERVATION</title>
<desc id="d">Community parking reservations with QR check-in. Deno-first admin + H5 — zero node_modules.</desc>
<defs>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowS" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="1.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowL" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="2" fill="#000" opacity="0.28"/>
  </pattern>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#4b3b78" opacity="0.35"/>
  </pattern>
  <linearGradient id="neon" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#ff2a6d"/><stop offset="0.5" stop-color="#a855f7"/><stop offset="1" stop-color="#05d9e8"/>
  </linearGradient>
  <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
    <stop offset="0.6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.55"/>
  </radialGradient>
</defs>
<style>
  text { font-family: 'JetBrains Mono','Fira Code','Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
  .cjk { font-family: 'JetBrains Mono','Fira Code','Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace, 'Noto Sans Mono CJK SC','Noto Sans CJK SC','PingFang SC','Hiragino Sans','Microsoft YaHei',sans-serif; }
  .flicker { animation: flicker 6s linear infinite; }
  @keyframes flicker {
    0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
    20%, 24%, 55% { opacity: 0.35; }
  }
  .blink { animation: blink 1.1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
  .blinkSoft { animation: beacon 1.4s ease-in-out infinite; }
  @keyframes beacon { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
  .scr { animation: flicker 2.5s steps(1) infinite; }
</style>

<path d="M22,4 H586 V188 L568,206 H4 V22 Z" fill="#120a26" stroke="#f9f002" stroke-opacity="0.6" stroke-width="1.5"/>
<path d="M4,22 L22,4 H92" fill="none" stroke="#f9f002" stroke-width="3"/>

<text x="26" y="40" font-size="10.5" fill="#f9f002" letter-spacing="2.5">// PARKING RESERVATION</text>
<text x="26" y="70" font-size="24" font-weight="800" fill="#e6f7ff" letter-spacing="1" filter="url(#glowS)">CarPark</text>
<g transform="translate(522.3,22)">
  <rect width="45.7" height="22" fill="#f9f002" fill-opacity="0.15" stroke="#f9f002"/>
  
  <text x="22.9" y="15.5" font-size="11.5" font-weight="800" fill="#f9f002" text-anchor="middle" letter-spacing="1">OSS</text>
</g>
<text x="26" y="100" font-size="13" fill="#8b7fb8">Community parking reservations with QR check-in.</text><text x="26" y="120" font-size="13" fill="#8b7fb8">Deno-first admin + H5 — zero node_modules.</text>
<g transform="translate(26,146)"><rect width="88.6" height="20" fill="#f9f002" fill-opacity="0.1" stroke="#f9f002" stroke-opacity="0.5"/><text x="8" y="14" font-size="11" fill="#f9f002">Spring Boot</text></g><g transform="translate(122.6,146)"><rect width="49" height="20" fill="#f9f002" fill-opacity="0.1" stroke="#f9f002" stroke-opacity="0.5"/><text x="8" y="14" font-size="11" fill="#f9f002">Vue 3</text></g><g transform="translate(179.6,146)"><rect width="42.4" height="20" fill="#f9f002" fill-opacity="0.1" stroke="#f9f002" stroke-opacity="0.5"/><text x="8" y="14" font-size="11" fill="#f9f002">Deno</text></g><g transform="translate(230,146)"><rect width="29.2" height="20" fill="#f9f002" fill-opacity="0.1" stroke="#f9f002" stroke-opacity="0.5"/><text x="8" y="14" font-size="11" fill="#f9f002">QR</text></g>
<text x="26" y="192" font-size="10.5" fill="#8b7fb8" letter-spacing="1">★ 0   ⑂ 0   ◆ Java   PUSHED 6D AGO</text>
<text x="560" y="192" font-size="11" fill="#f9f002" text-anchor="end" letter-spacing="1.5">JACK IN ▸</text>
</svg>
